<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>Anime LARP Quiz!</title>
</head>

<body>
    <header>
        <h1>Welcome to the Anime Larp Quiz!</h1>
        <h2>Are you larping by any chance?...</h2>
    </header>

    <main>
        <section class="Larp1" aria-labelledby="question">
            <p id="progress"></p>
            <h2 id="question"></h2>
            <div id="options"></div>
            <p id="feedback" aria-live="polite"></p>
            <button id="next" type="button" hidden>Next question</button>
            <h2 id="results" aria-live="polite"></h2>
        </section>
    </main>
</body>

</html>
